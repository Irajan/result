<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grade Calculator</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="./constants/app.js"></script>
    <script src="./utils/app.js"></script>
  </head>

  <body>
    <div class="container">
      <header>
        <h1>Grade Calculator</h1>
      </header>
      <main>
          <div class="input-container">
            <input
              id="num-subjects"
              type="number"
              class="subject-number-input"
              placeholder="Number of Subjects"
              min="1"
              required
            />
          </div>
          <div class="input-container">
            <input type="text" placeholder="Grade" required id="grade-input" />
          </div>
          <div class="input-container">
            <input
              type="text"
              placeholder="Total Attendance"
              required
              id="total-attendance-input"
            />
          </div>
          <div class="upload-section">
            <input type="file" class="file-input" accept=".xls, .xlsx" />
          </div>

        <dialog id="subject-dialog" class="dialog">
          <div class="dialog-row">
            <div class="dialog-item">Subject</div>
            <div class="dialog-item">Full Marks</div>
          </div>
        </dialog>
      </main>
    </div>
    <div id="result-holder"></div>

    <button id="export-btn" class="top-fixed">Export PDF</button>

    <script src="script.js"></script>
  </body>
</html>
